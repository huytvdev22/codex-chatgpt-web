<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Code Test</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #e5eefb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.32), transparent 34%),
        radial-gradient(circle at 80% 80%, rgba(8, 145, 178, 0.26), transparent 32%),
        #07111f;
    }

    .card {
      width: min(100%, 680px);
      padding: 40px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(18px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.12);
      color: #86efac;
      font-size: 14px;
      font-weight: 700;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 14px #22c55e;
    }

    h1 {
      margin: 24px 0 12px;
      font-size: clamp(32px, 7vw, 54px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: #a9bad1;
      font-size: 17px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #0891b2);
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.28);
      transition: transform 160ms ease, filter 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
    }

    button:focus-visible {
      outline: 3px solid #7dd3fc;
      outline-offset: 3px;
    }

    #result {
      min-height: 27px;
      margin-top: 22px;
      color: #67e8f9;
      font-weight: 700;
    }

    @media (max-width: 520px) {
      .card {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge"><span class="dot"></span>HTML hoạt động</span>
    <h1>Xin chào anh Huy!</h1>
    <p>
      Đây là trang HTML độc lập do Copilot tạo để kiểm tra nhanh HTML, CSS responsive
      và JavaScript tương tác mà không cần cài thêm thư viện.
    </p>
    <div class="actions">
      <button id="testButton" type="button">Chạy kiểm tra</button>
    </div>
    <div id="result" role="status" aria-live="polite"></div>
  </main>

  <script>
    const testButton = document.querySelector("#testButton");
    const result = document.querySelector("#result");
    let testCount = 0;

    testButton.addEventListener("click", () => {
      testCount += 1;
      result.textContent = `✅ JavaScript hoạt động tốt. Lần kiểm tra: ${testCount}`;
    });
  </script>
</body>
</html>
